<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Robert Eshleman</title>
    <style>
      html {
        background: url("https://dl.dropboxusercontent.com/u/5444056/j_train_copyright_2013_robert_eshleman.jpg") no-repeat center center fixed;
        -webkit-background-size: cover;
        -moz-background-size: cover;
        -o-background-size: cover;
        background-size:cover;
      }
      body {
        margin: 0px;
        padding: 0px;
      /*  background-color: #8DBAE1; */
      }
      .center {
        position: relative;
        margin-left: auto;
        margin-right: auto;
      }
      #main {
        width: 640px;
        top: 75px;
        background-color: rgba(128, 153, 204, 0.7);
        text-color: #FFFFFF;
/*        border: 2px solid #E6EBF5; */
        padding: 2px; 
        border-radius: 15px;
/*        box-shadow: 5px 5px 10px #B2C2E0; */
        box-shadow: 0 5px 6px rgba(0,0,0,0.3), inset 0 -3px 3px rgba(0,0,0,0.3);
      }
      #main p {
        font-size: 20px;
        font-family: "Helvetica";
        padding: 5px;
      }
      #headshot {
        position: relative;
        top: 50px;
      }
      img.round {
        display: block;
        border-radius: 200px;
      }
      #footer {
        position: absolute;
        bottom: 40px;
        width: 100%;
        background-color: rgba(0,0,0,0.6);
        padding: 10px;
      }
      #footer p {
        color: #DDDDDD;
        font-size: 16px;
        font-family: "Helvetica";
        margin: 3px;
      }
    </style>
  </head>
  <body>
    <div id="headshot">
      <img class="round center" width="275" src="images/robert_eshleman.jpg" alt="Photo of Robert Eshleman">
    </div>
    <div id="main" class="center">
      <p>Hello, World!</p>
    </div>
    <div id="footer">
      <p>Some links to contact me go here! Copyright &copy; 2014 Robert Eshleman</p>
    </div>
  </body>
</html>
