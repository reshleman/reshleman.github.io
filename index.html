<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Robert Eshleman</title>
    <style>
      body {
        margin: 0px;
        padding: 0px;
        background-color: #002E8A;
      }
      .center {
        position: relative;
        margin-left: auto;
        margin-right: auto;
      }
      #main {
        width: 640px;
        top: 75px;
        background-color: rgba(128, 153, 204, 0.7);
        text-color: #FFFFFF;
/*        border: 2px solid #E6EBF5; */
        padding: 2px; 
        border-radius: 15px;
/*        box-shadow: 5px 5px 10px #B2C2E0; */
        box-shadow: 0 5px 6px rgba(0,0,0,0.3), inset 0 -3px 3px rgba(0,0,0,0.3);
      }
      #main p {
        font-size: 20px;
        font-family: "Helvetica";
        padding: 5px;
      }
      #headshot {
        position: relative;
        top: 50px;
      }
      img.round {
        display: block;
        border-radius: 200px;
      }
    </style>
  </head>
  <body>
    <div id="headshot">
      <img class="round center" width="275px" src="images/robert_eshleman.jpg" alt="Photo of Robert Eshleman">
    </div>
    <div id="main" class="center">
      <p>Hello, World!</p>
    </div>
  </body>
</html>
